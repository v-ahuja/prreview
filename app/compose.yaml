services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: walkthrough
      POSTGRES_USER: walkthrough
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walkthrough"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://walkthrough:${POSTGRES_PASSWORD}@db:5432/walkthrough
    command: ["node", "src/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://walkthrough:${POSTGRES_PASSWORD}@db:5432/walkthrough
      HOST: 0.0.0.0
      PORT: 3000
    command: ["node", "src/server.js"]
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://walkthrough:${POSTGRES_PASSWORD}@db:5432/walkthrough
    command: ["node", "src/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  dbdata:
